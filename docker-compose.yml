services:
  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: order-service:latest
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVER_URL=http://simple-authorization-server:8085/oauth/check_token
    networks:
      - oauth2-network

networks:
  oauth2-network:
    external: true
